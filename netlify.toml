[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "20.0.0"
  NPM_VERSION = "9.6.7"  # Compatible with Node.js 20.0.0
  YARN_VERSION = "1.22.19"  # Updated to latest stable
  CI = "false"  # Disable CI to prevent build failures on warnings

[build.image]
  # Use the latest Ubuntu 22.04 based build image
  base = "ubuntu-22.04"
  version = "1"

[dev]
  # Settings for netlify dev
  framework = "create-react-app"
  targetPort = 3000
  port = 8888
  autoLaunch = false

# No need for Next.js specific configurations
# Remove any Next.js related environment variables
[context.production.environment]
  NODE_ENV = "production"
  GENERATE_SOURCEMAP = "false"
  NEXT_TELEMETRY_DISABLED = "1"

[context.deploy-preview.environment]
  NODE_ENV = "development"
  NEXT_TELEMETRY_DISABLED = "1"

[context.branch-deploy.environment]
  NODE_ENV = "development"
  NEXT_TELEMETRY_DISABLED = "1"
